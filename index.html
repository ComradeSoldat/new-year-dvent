    <title>Новогодний Адвент Календарь</title>
	<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 	viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎄</text></svg>">

    <!-- Подключаем праздничный шрифт с поддержкой кириллицы (Caveat) -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #b3000c; /* Глубокий красный */
            --door-color: #1a472a; /* Еловый зеленый */
            --door-hover: #2d6642;
            --text-gold: #f8d568;
            --snow-color: rgba(255, 255, 255, 0.2);
        }

        body {
            margin: 0;
            padding: 0;
            /* Отступ для body, чтобы баннер не перекрывал нижние карточки */
            padding-bottom: 100px; 
            background-color: var(--bg-color);
            /* Простой паттерн снежинок на фоне */
            background-image: 
                radial-gradient(var(--snow-color) 1px, transparent 1px),
                radial-gradient(var(--snow-color) 1px, transparent 1px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            font-family: 'Caveat', cursive;
            color: white;
            min-height: 100vh;
        }

        /* 1. Место для картинки сверху */
         .header-placeholder {
            width: 40%;
            height: 200px;
            margin: 0 auto;
            display: flex;       /* Это важно для выравнивания */
            display: block;       /* Это важно для выравнивания */
            align-items: center;
            justify-content: center;
            overflow: hidden;

            /* Новые свойства для ссылки: */
            text-decoration: none; /* Убираем подчеркивание */
            cursor: pointer;       /* Курсор в виде руки */
            transition: transform 0.3s; /* Плавная анимация нажатия */
        }

        /* Эффект при наведении на шапку */
        .header-placeholder:hover {
            transform: scale(1.02); /* Чуть увеличивается */
            box-shadow: 0 0 15px var(--text-gold); /* Свечение */
        }

        .header-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            height: auto;
            object-fit: contain;
            display: block; /* ОБЯЗАТЕЛЬНО: делаем картинку видимой */
        }

        /* Основной контейнер */
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 2. Сетка для 31 элемента */
        .calendar-grid {
            display: grid;
            /* Адаптивные колонки: минимум 150px шириной */
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }

        /* Карточка дня */
        .day-card {
            aspect-ratio: 9 / 16; /* Вертикальный формат */
            position: relative;
            cursor: pointer;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            overflow: hidden;
            background: #fff;
            border: 2px solid var(--text-gold);
            transition: transform 0.2s;
        }

        .day-card:hover {
            transform: scale(1.02);
            box-shadow: 0 0 15px var(--text-gold);
        }

        /* "Дверка" с номером */
        .door {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--door-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            color: var(--text-gold);
            z-index: 2;
            transition: opacity 0.6s ease, transform 0.6s ease;

            /* Декоративная рамка внутри дверки */
            border: 4px dotted var(--text-gold);
            box-sizing: border-box;
        }

        /* Контент (GIF) */
        .gif-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        .gif-content img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Состояние "Открыто" */
        .day-card.open .door {
            opacity: 0;
            pointer-events: none;
            transform: scale(1.1);
        }

        /* Дополнительный декор: ленточка на закрытой дверке */
        .door::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 10px;
            background: rgba(255,215,0, 0.3);
            top: 50%;
            transform: translateY(-50%);
        }
        .door::after {
            content: '';
            position: absolute;
            height: 100%;
            width: 10px;
            background: rgba(255,215,0, 0.3);
            left: 50%;
            transform: translateX(-50%);
        }

        /* --- КНОПКИ УПРАВЛЕНИЯ --- */

        /* Общий стиль для круглых кнопок */
        .control-btn {
            position: fixed;
            bottom: 100px; /* Отступ снизу (над баннером) */
            z-index: 999;
            border: none;
            outline: none;
            background-color: var(--text-gold); 
            color: var(--bg-color); 
            cursor: pointer;
            padding: 12px 0; /* Высоту задаем паддингом, ширину фиксируем для круга */
            width: 50px;
            height: 50px;
            border-radius: 50%; 
            font-size: 24px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: background-color 0.3s, transform 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:hover {
            background-color: #fff; 
            transform: scale(1.1); 
            color: var(--door-color);
        }

        /* Кнопка "Наверх" - справа */
        #myBtn {
            display: none; /* Скрыта по умолчанию, пока не скроллим */
            right: 20px;
        }

        /* Кнопка "Сброс" - слева */
        #resetBtn {
            left: 20px;
        }

        /* Стиль самого баннера */
        .bottom-banner {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--door-color); /* Еловый зеленый */
            border-top: 4px solid var(--text-gold);
            padding: 15px 0;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.5);
            z-index: 1000; /* Поверх всего */
            transition: background-color 0.3s, transform 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .bottom-banner:hover {
            background-color: var(--door-hover);
            transform: translateY(-2px);
        }

        .banner-text {
            color: var(--text-gold);
            font-size: 2rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(248, 213, 104, 0.5);
        }
    </style>

                <div class="gif-content">

            `;

            });

        }

            } else {
                mybutton.style.display = "none";
            }
        }

        function topFunction() {
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        // --- ЛОГИКА КНОПКИ СБРОСА ---
        function resetCalendar() {
            // Находим все открытые карточки
            const openCards = document.querySelectorAll('.day-card.open');

            // Проходим по каждой и убираем класс 'open'
            openCards.forEach(card => {
                card.classList.remove('open');
